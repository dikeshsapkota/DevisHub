services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devishub
      POSTGRES_USER: devishub
      POSTGRES_PASSWORD: devishub
    ports:
      - "5432:5432"
    volumes:
      - devishub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devishub -d devishub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devishub_postgres:
